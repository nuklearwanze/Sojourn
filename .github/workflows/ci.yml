name: CI

on:
  push:
    branches: ["main", "master", "[0-9][0-9][0-9]-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Determinism: forbid FP-behaviour-altering flag injection (research R7).
  RUSTFLAGS: ""

jobs:
  lint:
    name: fmt + clippy + deny (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: dependency audit (no UI crates, licences)
        uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux'

  test:
    name: tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  determinism:
    name: determinism suite (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sojourn-harness --release
      - name: data validation
        run: |
          cargo run -q -p sojourn-harness --release -- validate-data data/kernel
          cargo run -q -p sojourn-harness --release -- validate-data data/astro
          cargo run -q -p sojourn-harness --release -- validate-data data/world
          cargo run -q -p sojourn-harness --release -- validate-data data/research
          cargo run -q -p sojourn-harness --release -- validate-data data/vehicle
          cargo run -q -p sojourn-harness --release -- validate-data data/econ
          cargo run -q -p sojourn-harness --release -- validate-data data/base
          cargo run -q -p sojourn-harness --release -- validate-data data/crew
          cargo run -q -p sojourn-harness --release -- validate-data data/polity
      - name: double-run determinism (smoke + interrupts + astro + world + research + vehicle + economy + base + crew + polity)
        run: |
          cargo run -q -p sojourn-harness --release -- verify scenarios/smoke_decade.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/interrupts.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/astro_coast.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/astro_transfer.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/astro_lowthrust.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/survey_refine.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/research_program.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/vehicle_design.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/economy_logistics.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/base_construction.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/crew_mission.ron
          cargo run -q -p sojourn-harness --release -- verify scenarios/politics_world.ron
      - name: astro round-trip (mid-burn save)
        run: cargo run -q -p sojourn-harness --release -- roundtrip scenarios/astro_transfer.ron --save-at-ticks 610,19600
      - name: save/load round-trip (kernel + world + research)
        run: |
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/smoke_decade.ron --save-at-ticks 2592000,15000000,94608000
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/survey_refine.ron --save-at-ticks 350,600
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/research_program.ron --save-at-ticks 43200000,216000000
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/vehicle_design.ron --save-at-ticks 100,300
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/economy_logistics.ron --save-at-ticks 300000,700000
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/base_construction.ron --save-at-ticks 250,50000
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/crew_mission.ron --save-at-ticks 86400,7776000,12960000
          cargo run -q -p sojourn-harness --release -- roundtrip scenarios/politics_world.ron --save-at-ticks 86400,5184000,12960000
      - name: mutation gate has teeth
        run: cargo run -q -p sojourn-harness --release -- mutate --all
      - name: crash recovery
        run: cargo run -q -p sojourn-harness --release -- killtest scenarios/smoke_decade.ron --trials 12
      - name: module conformance
        run: |
          cargo run -q -p sojourn-harness --release -- conformance --module toy
          cargo run -q -p sojourn-harness --release -- conformance --module synthetic
          cargo run -q -p sojourn-harness --release -- conformance --module astro
          cargo run -q -p sojourn-harness --release -- conformance --module world
          cargo run -q -p sojourn-harness --release -- conformance --module research
          cargo run -q -p sojourn-harness --release -- conformance --module vehicle
          cargo run -q -p sojourn-harness --release -- conformance --module economy
          cargo run -q -p sojourn-harness --release -- conformance --module base
          cargo run -q -p sojourn-harness --release -- conformance --module crew
          cargo run -q -p sojourn-harness --release -- conformance --module polity

  # Architecture audit: the core must carry no presentation-layer dependency.
  audit:
    name: dependency + scope audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: no UI/Tauri/render crates in the core tree
        run: |
          if cargo tree -p sojourn-core --prefix none 2>/dev/null | grep -Ei '^(tauri|wry|tao|winit|wgpu|egui|webview2)' ; then
            echo "::error::presentation-layer crate found in sojourn-core dependency tree (FR-CORE-702)"
            exit 1
          fi
          echo "core dependency tree is presentation-free"
