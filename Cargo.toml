[workspace]
resolver = "2"
members = [
    "crates/sojourn-core",
    "crates/sojourn-astro",
    "crates/sojourn-world",
    "crates/sojourn-worldbuild",
    "crates/sojourn-research",
    "crates/sojourn-vehicle",
    "crates/sojourn-economy",
    "crates/sojourn-base",
    "crates/sojourn-crew",
    "crates/sojourn-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# default-features off: drops the no_std `heapless` path (and its unmaintained
# `atomic-polyfill` transitive) — we only need the std codec.
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand_core = "0.6"
rand_chacha = { version = "0.3", features = ["serde1"] }
blake3 = "1"
slotmap = { version = "1", features = ["serde"] }
libm = "0.2"
thiserror = "2"
ron = "0.8"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"

# Determinism: default codegen only. No fast-math equivalents exist in stable Rust;
# CI additionally rejects RUSTFLAGS/target-feature overrides that alter FP behaviour.
[profile.release]
debug = true
